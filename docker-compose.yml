name: rehabloop

# One command with a filled .env: docker compose up --build
# Dev mode is the default: Vite dev server + uvicorn --reload + fixture vision.
# All configuration comes from the root .env via Compose interpolation.
# VITE_* values are PUBLIC build-time config; secrets stay server-side only.

services:
  vision_service:
    build:
      context: ./vision_service
      target: dev
    environment:
      VISION_MODE: ${VISION_MODE:-fixture}
      VISION_DEVICE: ${VISION_DEVICE:-cpu}
      MOVENET_MODEL_PATH: ${MOVENET_MODEL_PATH:-/models/movenet_singlepose_lightning.tflite}
      MOVENET_MODEL_NAME: ${MOVENET_MODEL_NAME:-movenet-singlepose-lightning}
      MOVENET_TARGET_SIDE: ${MOVENET_TARGET_SIDE:-left}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_FRAME_RATE: ${MAX_FRAME_RATE:-8}
    volumes:
      # Source bind mount for live reload; checkpoints are NEVER written here.
      - ./vision_service:/app
      # Synthetic fixtures only, read-only. No patient footage, no weights.
      - ./fixtures:/fixtures:ro
      # Optional local model directory; empty fixture installs can use fixtures/.
      - ${MOVENET_MODEL_ROOT:-./fixtures}:/models:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    depends_on:
      vision_service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-dev}
      VISION_MODE: ${VISION_MODE:-fixture}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL_ID: ${NVIDIA_MODEL_ID:-}
      STORE_RAW_VIDEO: ${STORE_RAW_VIDEO:-false}
      MAX_FRAME_RATE: ${MAX_FRAME_RATE:-8}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://vision_service:8001}
      SESSION_TOKEN_TTL_SECONDS: ${SESSION_TOKEN_TTL_SECONDS:-300}
      MOVENET_MODEL_NAME: ${MOVENET_MODEL_NAME:-movenet-singlepose-lightning}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Public build-time config only. Never put a secret in a VITE_* value.
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_FRAME_SAMPLE_RATE: ${VITE_FRAME_SAMPLE_RATE:-8}
    volumes:
      - ./frontend:/app
      # Keep container-only Linux node_modules separate from the Windows host.
      - /app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
