# Real Sapiens2 inference. Prerequisites:
#   - NVIDIA Driver + NVIDIA Container Toolkit on the host
#   - the Sapiens2 licence reviewed for this movement-analysis use
#   - approved pose + DETR checkpoints in SAPIENS_CHECKPOINT_ROOT
#   - the licensed Sapiens2 source tree in SAPIENS_SOURCE_ROOT
# Use: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Weights and source are mounted read-only and are NEVER committed.

services:
  vision_service:
    build:
      context: ./vision_service
      target: gpu
    environment:
      VISION_MODE: sapiens
      VISION_DEVICE: cuda
      SAPIENS_CHECKPOINT_ROOT: /checkpoints
      SAPIENS_ROOT: /sapiens
      SAPIENS_POSE_CONFIG: ${SAPIENS_POSE_CONFIG:-}
      SAPIENS_DATASET: ${SAPIENS_DATASET:-shutterstock_goliath_3po}
      SAPIENS_CHECKPOINT_FILE: ${SAPIENS_CHECKPOINT_FILE:-}
      SAPIENS_TARGET_SIDE: ${SAPIENS_TARGET_SIDE:-left}
    volumes:
      - ${SAPIENS_CHECKPOINT_ROOT:-./fixtures/approved_test_frames}:/checkpoints:ro
      - ${SAPIENS_SOURCE_ROOT:-./fixtures/approved_test_frames}:/sapiens:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
